spring.application.name=rotina-api

# Render (e a maioria dos hosts gratuitos) define a porta via variavel de
# ambiente PORT. Localmente, sem essa variavel, cai no fallback 8080 de sempre.
server.port=${PORT:8080}

# Conexao com o banco. Em producao, sempre defina DB_URL/DB_USERNAME/DB_PASSWORD
# como variavel de ambiente. O valor depois dos ":" e so o fallback de dev local
# (banco "rotina_api" criado via Homebrew/postgresql@16).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/rotina_api}
spring.datasource.username=${DB_USERNAME:rotina_api}
spring.datasource.password=${DB_PASSWORD:rotina_api_dev}

# update = Hibernate cria/ajusta as tabelas com base nas Entities automaticamente.
# Bom para desenvolvimento; numa aplicacao real isso seria substituido por
# migrations versionadas (Flyway/Liquibase).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Desliga os "prepared statements" no lado do servidor do Postgres. Sem isso,
# uma query que roda repetidas vezes na mesma conexao fica com o plano de
# execucao cacheado pelo Postgres/pooler do Neon; se uma coluna usada nela
# muda de tipo (ALTER TABLE) enquanto o app esta no ar, essa conexao passa a
# falhar com "cached plan must not change result type" ate ser reciclada.
spring.datasource.hikari.data-source-properties.prepareThreshold=0

# Segredo do JWT: sem fallback de proposito. Se JWT_SECRET nao estiver
# definido como variavel de ambiente, o Spring recusa subir a aplicacao
# (regra do projeto: nunca hardcode segredo).
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Supabase Storage: usado so pra gerar a URL temporaria de upload de midia do
# exercicio. SUPABASE_JWT_SECRET e o segredo legado do projeto Supabase (Settings
# > JWT Keys > Legacy JWT Secret) - com ele o backend assina, na hora, um token
# com "role: service_role" (mesmo mecanismo do nosso proprio JwtUtil). E secreto,
# so o backend usa, nunca vai pro app. Opcional de proposito: sem essas
# variaveis, so o endpoint de gerar URL de upload fica indisponivel, o resto da
# API continua funcionando normal.
app.supabase.url=${SUPABASE_URL:}
app.supabase.jwt-secret=${SUPABASE_JWT_SECRET:}
app.supabase.bucket=${SUPABASE_BUCKET:midias}
