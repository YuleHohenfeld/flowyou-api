spring.application.name=rotina-api

# Render (e a maioria dos hosts gratuitos) define a porta via variavel de
# ambiente PORT. Localmente, sem essa variavel, cai no fallback 8080 de sempre.
server.port=${PORT:8080}

# Conexao com o banco. Em producao, sempre defina DB_URL/DB_USERNAME/DB_PASSWORD
# como variavel de ambiente. O valor depois dos ":" e so o fallback de dev local
# (banco "rotina_api" criado via Homebrew/postgresql@16).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/rotina_api}
spring.datasource.username=${DB_USERNAME:rotina_api}
spring.datasource.password=${DB_PASSWORD:rotina_api_dev}

# update = Hibernate cria/ajusta as tabelas com base nas Entities automaticamente.
# Bom para desenvolvimento; numa aplicacao real isso seria substituido por
# migrations versionadas (Flyway/Liquibase).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Segredo do JWT: sem fallback de proposito. Se JWT_SECRET nao estiver
# definido como variavel de ambiente, o Spring recusa subir a aplicacao
# (regra do projeto: nunca hardcode segredo).
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
